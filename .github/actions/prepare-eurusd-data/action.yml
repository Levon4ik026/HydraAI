name: Prepare cached EURUSD M1 BID research data
description: Restore a verified shared Dukascopy EURUSD M1 history cache or download it once.
runs:
  using: composite
  steps:
    - name: Restore shared EURUSD M1 cache
      id: cache
      uses: actions/cache@v4
      with:
        path: download/eurusd-m1-bid-2024-01-01-2026-11-09.csv
        key: eurusd-m1-bid-2024-01-01-2026-11-09-v1-${{ runner.os }}
    - name: Set up Node.js
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Download EURUSD M1 BID history
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx --yes dukascopy-node -i eurusd -from 2024-01-01 -to 2026-11-09 -t m1 -f csv -v
    - name: Verify cached/downloaded raw data
      shell: bash
      run: |
        python - <<'PY'
        import csv
        from pathlib import Path
        p=Path("download/eurusd-m1-bid-2024-01-01-2026-11-09.csv")
        if not p.exists(): raise SystemExit("Dukascopy CSV missing")
        with p.open(newline="",encoding="utf-8-sig") as f:
            r=csv.DictReader(f); rows=list(r)
        if len(rows) != 1_061_819 or not {"timestamp","open","high","low","close"}.issubset(r.fieldnames or []):
            raise SystemExit(f"Frozen EURUSD snapshot mismatch: expected 1,061,819 rows, got {len(rows):,}")
        import hashlib
        digest=hashlib.sha256(p.read_bytes()).hexdigest()
        manifest=Path("download/eurusd-m1-bid-2024-01-01-2026-11-09.manifest.txt")
        manifest.write_text(
            "dataset_id=EURUSD_M1_BID_DUKASCOPY_2024-01-01_to_2026-11-09_snapshot_v1\\n"
            f"rows={len(rows)}\\nsha256={digest}\\n",
            encoding="utf-8"
        )
        print(f"Verified frozen snapshot: rows={len(rows):,}; sha256={digest}; cache_hit=${{ steps.cache.outputs.cache-hit }}")
        PY
