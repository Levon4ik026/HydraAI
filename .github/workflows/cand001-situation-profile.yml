name: HYD-CAND-001 market-situation profile discovery
on:
  workflow_dispatch:
  push:
    branches: [hydra/research-validation]
    paths:
      - "research/cand001_situation_profile.py"
      - ".github/workflows/cand001-situation-profile.yml"
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/prepare-eurusd-data
      - name: Run frozen candidate situation profile
        run: python research/cand001_situation_profile.py --data download/eurusd-m1-bid-2024-01-01-2026-11-09.csv --out research/CAND001_SITUATION_PROFILE_DISCOVERY.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: hydra-cand001-situation-profile-discovery
          path: research/CAND001_SITUATION_PROFILE_DISCOVERY.md
          if-no-files-found: error
