name: Math core tests
on:
  push:
    branches: [hydra/stabilization]
    paths:
      - "hydra_math_core.py"
      - "tests/**"
      - "research/reproduce_m5_bb_williams_adx.py"
      - "research/screen_put_strategies.py"
      - "research/frozen_put_candidate.py"
      - "research/watch_frozen_put_candidate.py"
      - "eurusd_history_extended.csv"
      - ".github/workflows/math-core-tests.yml"
  pull_request:
    branches: [hydra/stabilization]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce frozen M5 research holdout and weekly direction report at 92% payout
        run: python research/reproduce_m5_bb_williams_adx.py --verify-known-results | tee m5_direction_weekly_report.txt
      - name: Run exploratory PUT-only strategy screen
        run: python research/screen_put_strategies.py --top 20 | tee put_strategy_screen.txt
      - name: Upload PUT strategy screen
        uses: actions/upload-artifact@v4
        with:
          name: put-strategy-screen
          path: put_strategy_screen.txt
          if-no-files-found: error
      - name: Upload reproducible M5 report
        uses: actions/upload-artifact@v4
        with:
          name: m5-direction-weekly-report
          path: m5_direction_weekly_report.txt
          if-no-files-found: error
