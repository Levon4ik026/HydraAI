name: Research validation tests

on:
  push:
    branches: [hydra/research-validation]
    paths:
      - "research/**"
      - ".github/workflows/research-validation.yml"
  pull_request:
    branches: [hydra/research-validation, hydra/stabilization]

jobs:
  research-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run existing project tests
        run: python -m unittest discover -s tests -v
      - name: Run research tests
        run: python -m unittest discover -s research/tests -v

      - name: Run direction-separated winner-loser audit
        run: python research/win_loss_feature_audit.py --data eurusd_history_extended.csv --out research/WIN_LOSS_FEATURE_AUDIT.md
      - name: Run train-only interaction screen
        run: python research/interaction_screen.py --data eurusd_history_extended.csv --out research/INTERACTION_SCREEN.md
      - name: Run paired day-cluster bootstrap
        run: python research/day_cluster_bootstrap.py --data eurusd_history_extended.csv --out research/CLUSTER_BOOTSTRAP.md
      - name: Run causal loss-context audit
        run: python research/loss_context_audit.py --data eurusd_history_extended.csv --out research/LOSS_CONTEXT_AUDIT.md
      - name: Run causal sequence-state audit
        run: python research/sequence_state_audit.py --data eurusd_history_extended.csv --out research/SEQUENCE_STATE_AUDIT.md
      - name: Upload sequence-state audit
        uses: actions/upload-artifact@v4
        with:
          name: call-put-sequence-state-audit
          path: research/SEQUENCE_STATE_AUDIT.md
          if-no-files-found: error
      - name: Upload loss-context audit
        uses: actions/upload-artifact@v4
        with:
          name: call-put-loss-context-audit
          path: research/LOSS_CONTEXT_AUDIT.md
          if-no-files-found: error
      - name: Upload day-cluster bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: call-put-day-cluster-bootstrap
          path: research/CLUSTER_BOOTSTRAP.md
          if-no-files-found: error
      - name: Upload winner-loser audit
        uses: actions/upload-artifact@v4
        with:
          name: call-put-win-loss-feature-audit
          path: research/WIN_LOSS_FEATURE_AUDIT.md
          if-no-files-found: error
      - name: Upload interaction screen
        uses: actions/upload-artifact@v4
        with:
          name: call-put-train-only-interaction-screen
          path: research/INTERACTION_SCREEN.md
          if-no-files-found: error
