name: HYD-CAND-001 dependence-aware situation validation
on:
  workflow_dispatch:
  push:
    branches: [hydra/research-validation]
    paths:
      - "research/cand001_dependence_validation.py"
      - ".github/workflows/cand001-dependence-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/prepare-eurusd-data
      - name: Run dependence-aware frozen validation
        run: python research/cand001_dependence_validation.py --data download/eurusd-m1-bid-2024-01-01-2026-11-09.csv --out research/CAND001_DEPENDENCE_VALIDATION.md --reps 20000
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: hydra-cand001-dependence-validation
          path: research/CAND001_DEPENDENCE_VALIDATION.md
          if-no-files-found: error
