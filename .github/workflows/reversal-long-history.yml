name: Clean-slate strategy discovery screen

on:
  workflow_dispatch:
  push:
    branches: [hydra/research-validation]
    paths:
      - "research/standalone_strategy_screen.py"
      - ".github/workflows/reversal-long-history.yml"

permissions:
  contents: read

jobs:
  strategy-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download fresh EURUSD M1 BID history from Dukascopy
        run: |
          npx --yes dukascopy-node -i eurusd -from 2024-01-01 -to 2026-11-09 -t m1 -f csv -v
      - name: Verify raw history
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          from pathlib import Path
          files = sorted(Path("download").glob("eurusd-m1-bid-2024-01-01-2026-11-09.csv"))
          if not files:
              raise SystemExit("Dukascopy download missing")
          path = files[0]
          with path.open(newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              rows = list(reader)
          required = {"timestamp", "open", "high", "low", "close"}
          if not rows or not required.issubset(reader.fieldnames or []):
              raise SystemExit("Unexpected or empty raw CSV")
          stamps = [datetime.fromtimestamp(int(r["timestamp"]) / 1000, tz=timezone.utc) for r in rows]
          print(f"RAW_FILE={path}")
          print(f"RAW_ROWS={len(rows)}")
          print(f"FIRST_UTC={min(stamps).isoformat()}")
          print(f"LAST_UTC={max(stamps).isoformat()}")
          if len(rows) < 100_000:
              raise SystemExit("History unexpectedly short")
          PY
      - name: Run clean-slate strategy-family discovery
        run: |
          python research/standalone_strategy_screen.py --data download/eurusd-m1-bid-2024-01-01-2026-11-09.csv --out research/CLEAN_SLATE_STRATEGY_DISCOVERY.md
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: hydra-clean-slate-strategy-discovery
          path: research/CLEAN_SLATE_STRATEGY_DISCOVERY.md
          if-no-files-found: error
