name: Hydra research dataset snapshot validation
on:
  workflow_dispatch:
  push:
    branches: [hydra/research-validation]
    paths:
      - ".github/actions/prepare-eurusd-data/action.yml"
      - ".github/workflows/research-data-snapshot.yml"
permissions:
  contents: read
jobs:
  verify-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/prepare-eurusd-data
      - name: Publish immutable dataset manifest
        uses: actions/upload-artifact@v4
        with:
          name: hydra-eurusd-m1-snapshot-v1-manifest
          path: download/eurusd-m1-bid-2024-01-01-2026-11-09.manifest.txt
          if-no-files-found: error
